<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Applied before first paint to avoid a flash of the wrong theme; must
    // match the storage key/values theme.js uses.
    try {
      var savedTheme = localStorage.getItem('pendelgeist:theme');
      if (savedTheme && savedTheme !== 'system') {
        document.documentElement.setAttribute('data-theme', savedTheme);
        var savedPalette = localStorage.getItem('pendelgeist:theme:palette:' + savedTheme);
        if (savedPalette) {
          var palette = JSON.parse(savedPalette);
          for (var prop in palette) {
            document.documentElement.style.setProperty(prop, palette[prop]);
          }
        }
      }
    } catch (e) {}
  </script>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/eva-tv/styles.css">
  <title>Neon Genesis Evangelion TV - Sources</title>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="/">Home</a>
      <a href="/eva-tv">Evangelion TV</a>
      <span class="nav-title">Sources</span>
    </div>
  </nav>
  <script type="module" src="/theme.js"></script>
  <div class="container">
    <div class="section">
      <h2>Sources</h2>
      <p>Every citation gathered across the timeline, in one place. Links open in a new tab.</p>
      <ul class="show-list" id="sourcesList">
        <li class="loading">LOADING SOURCES...</li>
      </ul>
    </div>
  </div>

  <script type="module" src="/eva-tv/sources/app.js"></script>
</body>
</html>
